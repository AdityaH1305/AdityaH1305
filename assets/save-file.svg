<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Save file: Aditya Harikrishnan, Software Developer, Machine Learning specialisation">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>

    <linearGradient id="xpfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1c2530" stroke-width="1"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.022"/>
    </pattern>

    <clipPath id="round">
      <rect x="8" y="8" width="1184" height="324" rx="14"/>
    </clipPath>

    <style>
      .mono { font-family: "JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
      .lbl  { font-size: 11px; letter-spacing: 2.6px; fill: #64748b; }
      .val  { font-size: 15px; letter-spacing: 0.4px; fill: #e6edf3; }
      .cy   { fill: #00f7ff; }

      .blink { animation: bl 1.15s steps(1) infinite; }
      @keyframes bl { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }

      .sweep { animation: sw 4.5s ease-in-out infinite; }
      @keyframes sw { 0%,100% { opacity: .30 } 50% { opacity: .95 } }

      .bar { animation: grow 2.1s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { from { width: 0 } to { width: 452px } }

      .fade { opacity: 0; animation: fi .8s ease-out forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s }
      .d3 { animation-delay: .55s } .d4 { animation-delay: .75s }
      @keyframes fi { to { opacity: 1 } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect x="8" y="8" width="1184" height="324" fill="url(#panel)"/>
    <rect x="8" y="8" width="1184" height="324" fill="url(#grid)" opacity="0.55"/>
    <rect x="8" y="8" width="1184" height="324" fill="url(#scan)"/>
    <ellipse cx="1080" cy="60" rx="260" ry="150" fill="#00f7ff" opacity="0.05"/>
    <rect x="8" y="8" width="1184" height="3" fill="url(#accent)" class="sweep"/>
  </g>
  <rect x="8" y="8" width="1184" height="324" rx="14" fill="none" stroke="#26303d" stroke-width="1.5"/>

  <!-- top status strip -->
  <g class="mono fade d1">
    <text x="42" y="52" class="lbl cy">◆ SAVE FILE 01</text>
    <text x="1158" y="52" class="lbl" text-anchor="end">SLOT: ACTIVE &#160;·&#160; AUTOSAVE ON</text>
  </g>
  <line x1="42" y1="68" x2="1158" y2="68" stroke="#1e2836" stroke-width="1"/>

  <!-- portrait -->
  <g class="fade d2">
    <rect x="46" y="96" width="132" height="132" rx="8" fill="#131a24" stroke="#2b3a4a" stroke-width="1.5"/>
    <text x="112" y="180" class="mono cy" font-size="50" font-weight="700" text-anchor="middle">AH</text>
    <path d="M46 116V104a8 8 0 018-8h14" fill="none" stroke="#00f7ff" stroke-width="2.5"/>
    <path d="M178 208v12a8 8 0 01-8 8h-14" fill="none" stroke="#7c5cff" stroke-width="2.5"/>
  </g>

  <!-- identity -->
  <g class="mono fade d2">
    <text x="212" y="146" font-size="42" font-weight="700" letter-spacing="1" fill="#e6edf3">ADITYA HARIKRISHNAN</text>
    <text x="214" y="176" font-size="13" letter-spacing="4.2px" fill="#8b949e">SOFTWARE DEVELOPER &#160;·&#160; ML SPECIALISATION</text>
  </g>

  <!-- stat row -->
  <g class="mono fade d3">
    <text x="214" y="222" class="lbl">CLASS</text>
    <text x="214" y="243" class="val">Backend / Full-Stack</text>

    <text x="450" y="222" class="lbl">SPEC</text>
    <text x="450" y="243" class="val">Deep Learning</text>

    <text x="672" y="222" class="lbl">GUILD</text>
    <text x="672" y="243" class="val">IIIT Pune</text>

    <text x="866" y="222" class="lbl">REGION</text>
    <text x="866" y="243" class="val">India</text>

    <text x="1048" y="222" class="lbl">LEVEL</text>
    <text x="1048" y="245" class="val cy" font-size="19" font-weight="700">21</text>
  </g>

  <!-- xp bar -->
  <g class="mono fade d4">
    <text x="214" y="286" class="lbl">B.TECH PROGRESS</text>
    <rect x="214" y="296" width="452" height="9" rx="4.5" fill="#1a2330" stroke="#26303d" stroke-width="1"/>
    <rect x="214" y="296" height="9" rx="4.5" fill="url(#xpfill)" class="bar" width="452"/>
    <text x="684" y="305" font-size="12" letter-spacing="1.4px" fill="#8b949e">75%</text>

    <text x="1158" y="304" font-size="13" letter-spacing="2.4px" text-anchor="end" fill="#00f7ff">
      ▸ CONTINUE<tspan class="blink">_</tspan>
    </text>
  </g>
</svg>
